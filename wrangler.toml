# wrangler.toml — the project `npx wrangler deploy` builds (the CI's user
# deploy command): one Worker serving the static SPA (assets), the /api/*
# Pages Function modules, the WarehouseLedger Durable Object, queue consumers
# and cron triggers. A classic Pages project can also be connected instead —
# see DEPLOY.md.
#
# First deploy needs NO pre-created resources: only ASSETS and the
# WarehouseLedger Durable Object are bound. The resource bindings below are
# prepared templates — the Cloudflare API rejects placeholder IDs at deploy
# time (code 10042), so create the resource, paste the real ID, uncomment the
# block, and push (see DEPLOY.md §5).

name = "inventoryazhartexcloudflare"
main = "worker/src/app.js"
compatibility_date = "2026-11-01"

# Static SPA. Every request runs the worker first (schema-stable across
# wrangler versions); the entry serves /api/* and hands everything else to
# env.ASSETS (404.html bounce page for unknown paths).
[assets]
directory = "./app"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "404-page"

# ── Resource bindings ───────────────────────────────────────────────────────
# Everything between the scissors markers is REWRITTEN at build time by
# tools/provision.mjs (npm postinstall) when the build has a Cloudflare API
# token: it finds-or-creates the resources and writes real IDs here — IDs are
# account-local and never committed. Without a token the templates below stay
# commented: create the resource, paste the real ID, uncomment, push.
# wrangler d1 create fabric-roll-stock → paste the returned database_id
# wrangler d1 migrations apply fabric-roll-stock --remote
# --8<-- provisioned-bindings-start

# [[d1_databases]]
# binding = "DB"
# database_name = "fabric-roll-stock"
# database_id = "PASTE-DATABASE-ID"
# migrations_dir = "migrations"

# wrangler kv namespace create CACHE → paste the returned id
# [[kv_namespaces]]
# binding = "CACHE"
# id = "PASTE-KV-NAMESPACE-ID"

# wrangler r2 bucket create fabric-roll-exports
# [[r2_buckets]]
# binding = "EXPORTS"
# bucket_name = "fabric-roll-exports"

# wrangler queues create audit-queue / email-queue / export-queue
# wrangler queues create audit-queue-dlq / email-queue-dlq / export-queue-dlq
# [[queues.producers]]
# binding = "AUDIT_QUEUE"
# queue = "audit-queue"

# --8<-- provisioned-bindings-end

# ── Always bound (self-contained) ───────────────────────────────────────────

# WarehouseLedger serialises stock mutations per warehouse and refuses
# negative stock. The movements API calls it through this binding and falls
# back to the identical shared implementation (shared/ledger-core.js) when the
# binding is absent (tests, classic Pages).
#
# NOTE: the migration must use new_sqlite_classes — Durable Objects on the
# free plan reject `new_classes` (API error 10097). The class code is
# unchanged: the classic storage API works on the SQLite backend.
[durable_objects]
bindings = [{ name = "WAREHOUSE_LEDGER", class_name = "WarehouseLedger" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WarehouseLedger"]
