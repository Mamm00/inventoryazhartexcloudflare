# wrangler.toml — Cloudflare Pages project bindings. Git-connected Pages reads
# this configuration so it is versioned with the code. Placeholders are filled
# in the dashboard (Settings → Bindings) after the first deploy; see DEPLOY.md.

name = "fabric-roll-stock"
pages_build_output_dir = "app"
compatibility_date = "2026-11-01"

[[d1_databases]]
binding = "DB"
database_name = "fabric-roll-stock"
database_id = "PLACEHOLDER"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "CACHE"
id = "PLACEHOLDER"

[[r2_buckets]]
binding = "EXPORTS"
bucket_name = "fabric-roll-exports"

[[queues.producers]]
binding = "AUDIT_QUEUE"
queue = "audit-queue"

[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "fabric_roll_events"

[[services]]
binding = "WAREHOUSE_LEDGER"
service = "fabric-roll-ledger-worker"
